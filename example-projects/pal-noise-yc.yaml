name: "PAL Noise YC"
description: "PAL test signal with Gaussian noise and separate YC output"

output:
  filename: "example-output/pal-noise-yc"
  format: "pal-yc"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "vitc"
        enabled: true
        lines: [15, 16, 17, 18, 19, 20, 328, 329, 330, 331, 332, 333]
        start_frame_offset: 0
      
      - type: "color-burst"
        enabled: true

  effects:
    - type: "noise"
      enabled: true
      snr_db: 35.0
      seed: 42

sections:
  - name: "Lead-in"
    duration: 1
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
  
  - name: "Test Content"
    duration: 20
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
  
  - name: "Lead-out"
    duration: 1
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
