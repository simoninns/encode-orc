  # Chapter 2: Audio Test - WAV file with silence padding
  - name: "Organ_Test_WAV"
    duration: 342
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_SMPTE_BARS.raw"
