name: "GGV1066 PAL VITC YC"
description: "PAL LaserDisc CLV virtual test tape with VITC timecode and separate Y/C output"

output:
  filename: "../ggv-output/ggv1066-pal-vitc-yc"
  format: "pal-yc"
  sound_format: "pcm"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "vitc"
        enabled: true
        lines: [16, 17, 18, 328, 329, 330]
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    vitc:
      timecode_start: "00:00:00.00"
  
  # Chapter 1: PAL Raw Test Images (50 frames each)
  - name: "625_50_100_BARS"
    duration: 50
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_100_BARS.raw"
    vitc:
      timecode_start: "00:00:00.00"
    sound:
      type: "sine"
      start_freq_hz: 50
  
  - name: "625_50_75_BARS"
    duration: 50
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    sound:
      type: "sine"
      start_freq_hz: 100
  
  - name: "625_50_75_BARS_RED"
    duration: 50
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS_RED.raw"
    sound:
      type: "sine"
      start_freq_hz: 315
  
  - name: "625_50_CHROMA_RAMP"
