  # Chapter 4: SMPTE Bars with Noise (SNR tests)
  - name: "SMPTE_BARS_SNR_30dB"
    duration: 125
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_SMPTE_BARS.raw"
    sound:
      type: "sine"
      start_freq_hz: 1000
    pipeline:
      effects:
        - type: "noise"
          enabled: true
          snr_db: 30
          seed: 42
  
  - name: "SMPTE_BARS_SNR_25dB"
