    sound:
      type: "sine"
      start_freq_hz: 500
    pipeline:
      effects:
        - type: "dropout"
          enabled: true
          density: 0.001
          multi_field_probability: 0.3
          single_field_probability: 0.7
          seed: 100
  
  - name: "SMPTE_BARS_DROPOUT_0.005"
