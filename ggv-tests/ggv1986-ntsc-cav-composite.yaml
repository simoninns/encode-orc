name: "GGV1986 NTSC CAV Composite"
description: "NTSC LaserDisc CAV virtual test disc"

output:
  filename: "../ggv-output/ggv1986-ntsc-cav-composite"
  format: "ntsc-composite"
  sound_format: "pcm"

laserdisc:
  mode: "cav"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 278, 279, 280]
        format: "picture-number"
      
      - type: "vits-ntsc"
        enabled: true
        signals:
          - line: 13
            signal: "ntc7-composite"
          - line: 19
            signal: "vir"
          - line: 275
            signal: "ntc7-combination"
          - line: 281
            signal: "vir"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-in"
      user_code: "1986"
  
