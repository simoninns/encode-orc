    duration: 50
    source:
      type: "yuv422-image"
      file: "../assets/pal-raw/625_50_100_BARS.raw"
    sound:
      type: "sine"
      start_freq_hz: 50
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 1
      chapter: 1
  
