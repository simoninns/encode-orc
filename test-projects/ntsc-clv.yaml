name: "NTSC-CLV Standard"
description: "NTSC LaserDisc with CLV timecode (IEC 60856-1986)"

output:
  filename: "test-output/ntsc-clv.tbc"
  format: "ntsc-composite"

laserdisc:
  mode: "clv"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
        format: "timecode"
      
      - type: "vits-ntsc"
        enabled: true
        signals:
          - line: 18
            signal: "itu-composite"
          - line: 19
            signal: "itu-its"
          - line: 281
            signal: "itu-composite"
          - line: 282
            signal: "itu-its"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Test Content"
    duration: 20
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 1
      timecode_start: "00:00:00:00"
