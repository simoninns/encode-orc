name: "Sound Types Test"
description: "Comprehensive test of all sound generation types"

output:
  filename: "../test-output/sound-test"
  format: "pal-composite"
  sound_format: "wav"

pipeline:
  metadata:
    generators:
      - type: "color-burst"
        enabled: true

sections:
  # Silence test
  - name: "Silence"
    duration: 50  # 2 seconds at 25fps
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Black.png"
    sound:
      type: "silence"
  
  # Sine wave tests
  - name: "Sine_50Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Red.png"
    sound:
      type: "sine"
      start_freq_hz: 50
  
  - name: "Sine_440Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Green.png"
    sound:
      type: "sine"
      start_freq_hz: 440
  
  - name: "Sine_1000Hz_50pct"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Blue.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      amplitude: 50
  
  - name: "Sine_5000Hz_100pct"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Cyan.png"
    sound:
      type: "sine"
      start_freq_hz: 5000
      amplitude: 100
  
  # Sine sweep up
  - name: "Sine_Sweep_Up_100Hz_to_2000Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Magenta.png"
    sound:
      type: "sine"
      start_freq_hz: 100
      end_freq_hz: 2000
  
  # Sine sweep down
  - name: "Sine_Sweep_Down_2000Hz_to_100Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Yellow.png"
    sound:
      type: "sine"
      start_freq_hz: 2000
      end_freq_hz: 100
  
  # Square wave tests
  - name: "Square_100Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-White.png"
    sound:
      type: "square"
      start_freq_hz: 100
  
  - name: "Square_440Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-02.png"
    sound:
      type: "square"
      start_freq_hz: 440
  
  - name: "Square_1000Hz_25pct"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-04.png"
    sound:
      type: "square"
      start_freq_hz: 1000
      amplitude: 25
  
  # Square sweep
  - name: "Square_Sweep_Up_200Hz_to_1000Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-08.png"
    sound:
      type: "square"
      start_freq_hz: 200
      end_freq_hz: 1000
  
  # Sawtooth wave tests
  - name: "Sawtooth_100Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-16.png"
    sound:
      type: "sawtooth"
      start_freq_hz: 100
  
  - name: "Sawtooth_440Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-32.png"
    sound:
      type: "sawtooth"
      start_freq_hz: 440
  
  - name: "Sawtooth_1000Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Squares-02.png"
    sound:
      type: "sawtooth"
      start_freq_hz: 1000
      amplitude: 90
  
  # Sawtooth sweep
  - name: "Sawtooth_Sweep_Down_1000Hz_to_200Hz"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Squares-04.png"
    sound:
      type: "sawtooth"
      start_freq_hz: 1000
      end_freq_hz: 200
  
  # Noise tests
  - name: "White_Noise"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Squares-08.png"
    sound:
      type: "white"
      amplitude: 40
      seed: 42
  
  - name: "Pink_Noise"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Squares-16.png"
    sound:
      type: "pink"
      amplitude: 40
      seed: 42
  
  - name: "Brown_Noise"
    duration: 50
    source:
      type: "png-image"
      file: "../testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Squares-32.png"
    sound:
      type: "brown"
      amplitude: 40
      seed: 42
