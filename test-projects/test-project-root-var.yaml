name: "PROJECT_ROOT Variable Test"
description: "Test ${PROJECT_ROOT} variable expansion"

output:
  filename: "${PROJECT_ROOT}/../test-output/project-root-var-test"
  format: "pal-composite"

pipeline:
  metadata:
    generators:
      - type: "color-burst"

sections:
