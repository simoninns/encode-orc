name: "PAL MOV Loader Test"
description: "PAL encoding from MOV/ProRes video file - tests MOV loader and frame extraction"

output:
  filename: "test-output/pal-mov.tbc"
  format: "pal-composite"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
      - type: "vits-pal"
        enabled: true
        signals:
          - { line: 12, field: 1, signal: "multiburst" }
          - { line: 18, field: 1, signal: "uk-national" }
          - { line: 12, field: 2, signal: "itu-its" }
          - { line: 18, field: 2, signal: "itu-composite" }
      - type: "color-burst"
        enabled: true

sections:
  # Encode first 40 frames from MOV file
  - name: "Video Sequence"
    duration: 40
    source:
      type: "mov-file"
      file: "testcard-images/pal-mov/625-50-i_PLUGE.mov"
      start_frame: 0
    laserdisc:
      picture_start: 1
    filters:
      chroma:
        enabled: true
      luma:
        enabled: false
    vbi:
      vits:
        enabled: true
