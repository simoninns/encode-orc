name: "NTSC Consumer Tape Test"
description: "NTSC consumer tape encoding with VITC - tests consumer-tape mode (VHS/Betamax/Video8)"

output:
  filename: "test-output/ntsc-consumer-tape.tbc"
  format: "ntsc-composite"

pipeline:
  metadata:
    generators:
      - type: "vitc"
        enabled: true
        lines: [18, 20]
        start_frame_offset: 0
      - type: "color-burst"
        enabled: true

sections:
  - name: "Recording Start"
    duration: 40
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    vbi:
      vitc:
        enabled: true
        start_time: "00:00:00:00"
