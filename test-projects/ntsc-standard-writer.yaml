name: "NTSC Standard Writer Test"
description: "NTSC composite encoding with standard writer (no padding, no metadata)"

output:
  filename: "test-output/ntsc-standard-writer.hackdac"
  format: "ntsc-composite"
  writer: "standard"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
      - type: "vits-ntsc"
        enabled: true
        signals:
          - { line: 17, field: 1, signal: "itu-composite" }
          - { line: 17, field: 2, signal: "itu-its" }
      - type: "color-burst"
        enabled: true

sections:
  - name: "Chapter 1"
    duration: 30
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    laserdisc:
      picture_start: 1
      chapter: 1
    vbi:
      vitc:
        enabled: true
        start_time: "00:00:00:00"
      vits:
        enabled: true
