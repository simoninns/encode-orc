name: "NTSC LaserDisc CLV Timecode (Explicit)"
description: "NTSC composite with explicit timecode specified for each section"

output:
  filename: "test-output/ntsc-timecode-explicit.tbc"
  format: "ntsc-composite"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        format: "timecode"
        lines: [15, 16, 17]
      - type: "vits-ntsc"
        enabled: true
        signals:
          - { line: 12, field: 1, signal: "ntc7-composite" }
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      disc_area: "lead-in"

  - name: "Section 1 - Starting at 00:30:15:00"
    duration: 15
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      timecode_start: "00:30:15:00"

  - name: "Section 2 - Starting at 01:00:00:15"
    duration: 10
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_MULTIBURST.raw"
    laserdisc:
      timecode_start: "01:00:00:15"

  - name: "Section 3 - Starting at 01:45:22:10"
    duration: 10
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_PLUGE.raw"
    laserdisc:
      timecode_start: "01:45:22:10"

  - name: "Lead-out"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      disc_area: "lead-out"
