name: "GGV1066"
description: "PAL LaserDisc CAV virtual test disc"

output:
  filename: "test-output/ggv1066"
  format: "pal-composite"
  sound_format: "pcm"

laserdisc:
  mode: "cav"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 328, 329, 330]
        format: "picture-number"
      
      - type: "vits-pal"
        enabled: true
        signals:
          - line: 13
            signal: "multiburst"
          - line: 19
            signal: "uk-national"
          - line: 325
            signal: "itu-combination"
          - line: 331
            signal: "itu-composite"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 2
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-in"
      user_code: "1066"
  
  # Chapter 1: PAL Raw Test Images (50 frames each)
  - name: "625_50_100_BARS"
    duration: 50
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_100_BARS.raw"
    sound:
      type: "sine"
      start_freq_hz: 50
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 1
      chapter: 1
  
  - name: "625_50_75_BARS"
