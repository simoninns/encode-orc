    duration: 50
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_100_BARS.raw"
    sound:
      - type: "sine"
        start_freq_hz: 50
        end_freq_hz: 50
        hz_per_field: 0
    biphase-vbi:
      disc_area: "programme-area"
