name: "PAL Standard Writer Test"
description: "PAL composite encoding with standard writer (no padding, no metadata)"

output:
  filename: "test-output/pal-standard-writer.hackdac"
  format: "pal-composite"
  writer: "standard"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
      - type: "vits-pal"
        enabled: true
        signals:
          - { line: 12, field: 1, signal: "multiburst" }
          - { line: 18, field: 1, signal: "uk-national" }
          - { line: 12, field: 2, signal: "itu-its" }
          - { line: 18, field: 2, signal: "itu-composite" }
      - type: "color-burst"
        enabled: true

sections:
  - name: "Chapter 1"
    duration: 25
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    laserdisc:
      picture_start: 1
      chapter: 1
    vbi:
      vitc:
        enabled: true
        start_time: "00:00:00:00"
      vits:
        enabled: true
