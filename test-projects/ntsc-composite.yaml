name: "NTSC Composite Test"
description: "NTSC composite encoding with YUV422 EIA color bars - tests lead-in, chapters, lead-out, and VITC"

output:
  filename: "test-output/ntsc-composite.tbc"
  format: "ntsc-composite"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
      - type: "vits-ntsc"
        enabled: true
        signals:
          - { line: 17, field: 1, signal: "itu-composite" }
          - { line: 17, field: 2, signal: "itu-its" }
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    laserdisc:
      leadin: true

  - name: "Chapter 1"
    duration: 15
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    laserdisc:
      picture_start: 1
      chapter: 1
    vbi:
      vitc:
        enabled: true
        start_time: "00:00:00:00"
      vits:
        enabled: true

  - name: "Chapter 2"
    duration: 15
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    laserdisc:
      picture_start: 16
      chapter: 2
    vbi:
      vitc:
        enabled: true
        start_time: "00:00:00:15"
      vits:
        enabled: true

  - name: "Lead-out"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    laserdisc:
      leadout: true
