name: "Amplitude Test"
description: "Test amplitude control and optional end_freq_hz"

output:
  filename: "test-output/amplitude-test"
  format: "pal-composite"
  sound_format: "wav"

pipeline:
  metadata:
    generators:
      - type: "color-burst"

sections:
  # Test default amplitude (75%)
  - name: "Sine_1kHz_Default"
    duration: 50  # 2 seconds
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Red.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      # No end_freq_hz - should default to start_freq_hz (constant tone)
      # No amplitude - should default to 75%
  
  # Test 25% amplitude
  - name: "Sine_1kHz_25pct"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Green.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      amplitude: 25
  
  # Test 50% amplitude
  - name: "Sine_1kHz_50pct"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Blue.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      amplitude: 50
  
  # Test 100% amplitude
  - name: "Sine_1kHz_100pct"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Cyan.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      amplitude: 100
  
  # Test sweep with amplitude (no end_freq_hz should still work for sweeps when specified)
  - name: "Sine_Sweep_60pct"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-White.png"
    sound:
      type: "sine"
      start_freq_hz: 100
      end_freq_hz: 2000
      amplitude: 60
  
  # Test balance: left only
  - name: "Sine_440Hz_LeftOnly"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Magenta.png"
    sound:
      type: "sine"
      start_freq_hz: 440
      balance: -100
  
  # Test balance: right only
  - name: "Sine_440Hz_RightOnly"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Yellow.png"
    sound:
      type: "sine"
      start_freq_hz: 440
      balance: 100
  
  # Test balance: partial left
  - name: "Sine_440Hz_Left50"
    duration: 50
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Geometry-Checkers-02.png"
    sound:
      type: "sine"
      start_freq_hz: 440
      balance: -50
