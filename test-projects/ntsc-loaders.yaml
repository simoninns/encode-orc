name: "NTSC Loader Types Demo - CAV"
description: "NTSC LaserDisc with CAV picture numbering - demonstrates supported loader types"

output:
  filename: "../test-output/ntsc-loaders"
  format: "ntsc-composite"

laserdisc:
  mode: "cav"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 278, 279, 280]
        format: "picture-number"
      
      - type: "vits-ntsc"
        enabled: true
        signals:
          - line: 13
            signal: "ntc7-composite"
          - line: 19
            signal: "vir"
          - line: 275
            signal: "ntc7-combination"
          - line: 281
            signal: "vir"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "YUV422 Raw Image Loader"
    duration: 5
    source:
      type: "yuv422-image"
      file: "../testcard-images/ntsc-raw/525_5994_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 1

  - name: "MOV File Loader"
    duration: 5
    source:
      type: "mov-file"
      file: "../testcard-images/ntsc-mov/525_5994_MOVING_ZONE_2H.mov"
      start_frame: 0
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 6

  - name: "PNG Image Loader"
    duration: 5
    source:
      type: "png-image"
      file: "../testcard-images/ntsc-wrwetzel-png/NTSC-720x480-Color-One-White.png"
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 11

  - name: "MP4 File Loader"
    duration: 10
    source:
      type: "mp4-file"
      file: "../testcard-images/ntsc-mp4/ntsc-nynashamn.mp4"
      start_frame: 0
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 16
