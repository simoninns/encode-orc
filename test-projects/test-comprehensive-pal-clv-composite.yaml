name: "Comprehensive PAL CLV Composite Test"
description: "Comprehensive unit test for PAL CLV composite format covering maximum functionality"

output:
  filename: "../test-output/comprehensive-pal-clv-composite"
  format: "pal-composite"
  writer: "tbc"
  metadata_decoder: "encode-orc"
  sound_format: "pcm"

laserdisc:
  mode: "clv"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
      luma:
        enabled: false
  
  metadata:
    generators:
      - type: "color-burst"
        enabled: true
      
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 328, 329, 330]
        format: "timecode"
      
      - type: "vits-pal"
        enabled: true
        signals:
          - line: 13
            signal: "multiburst"
          - line: 19
            signal: "uk-national"
          - line: 325
            signal: "itu-combination"
  
  effects:
    - type: "noise"
      enabled: true
      snr_db: 45.0
      seed: 22222
    
    - type: "dropout"
      enabled: true
      density: 0.001
      multi_field_probability: 0.40
      single_field_probability: 0.60
      seed: 33333

sections:
  # Lead-in section with user code
  - name: "Lead-in"
    duration: 1
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-in"
      user_code: "5678"
      spec: "standard"
    sound:
      type: "silence"
  
  # Chapter 1 - Test timecode start and sawtooth wave
  - name: "Chapter1_Part1"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      timecode_start: "00:00:00.00"
      chapter: 1
    sound:
      type: "sawtooth"
      start_freq_hz: 220
      amplitude: 70
      balance: 0
  
  # Chapter 1 continuation - Auto-increment timecode, white noise
  - name: "Chapter1_Part2"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 1
    sound:
      type: "white"
      amplitude: 45
      seed: 99999
  
  # Chapter 2 - Test chapter change without timecode reset, frequency sweep
  - name: "Chapter2"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 2
    sound:
      type: "sine"
      start_freq_hz: 100
      end_freq_hz: 10000
      amplitude: 90
  
  # Chapter 3 - Test brown noise
  - name: "Chapter3"
    duration: 2
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 3
    sound:
      type: "brown"
      amplitude: 55
      balance: 50
      seed: 44444
  
  # Lead-out section with user code
  - name: "Lead-out"
    duration: 1
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-out"
      user_code: "5678"
    sound:
      type: "silence"
