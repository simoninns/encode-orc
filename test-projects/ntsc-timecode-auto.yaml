name: "NTSC LaserDisc CLV Timecode (Auto)"
description: "NTSC composite with automatic timecode generation starting from 00:00:00:00"

output:
  filename: "test-output/ntsc-timecode-auto.tbc"
  format: "ntsc-composite"

pipeline:
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        format: "timecode"
        lines: [15, 16, 17]
      - type: "vits-ntsc"
        enabled: true
        signals:
          - { line: 12, field: 1, signal: "ntc7-composite" }
          - { line: 18, field: 1, signal: "ntc7-combination" }
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      disc_area: "lead-in"

  - name: "Color Bars"
    duration: 20
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      timecode_start: "00:00:00:00"

  - name: "Multiburst"
    duration: 10
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_MULTIBURST.raw"

  - name: "PLUGE"
    duration: 10
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_PLUGE.raw"

  - name: "Lead-out"
    duration: 5
    source:
      type: "yuv422-image"
      file: "testcard-images/ntsc-raw/525_5994_100_BARS.raw"
    laserdisc:
      disc_area: "lead-out"
