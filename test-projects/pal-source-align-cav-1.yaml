name: "Source Alignment PAL CAV 1-20"
description: "PAL CAV with picture numbers 1-20 for source alignment"

output:
  filename: "../test-output/pal-cav-1-20"
  format: "pal-composite"

laserdisc:
  mode: "cav"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 328, 329, 330]
        format: "picture-number"
      
      - type: "vits-pal"
        enabled: true
        signals:
          - line: 13
            signal: "multiburst"
          - line: 19
            signal: "uk-national"
          - line: 325
            signal: "itu-combination"
          - line: 331
            signal: "itu-composite"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Lead-in"
    duration: 1
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-in"
      user_code: "1986"
  
  - name: "Test Content"
    duration: 20
    source:
      type: "mp4-file"
      file: "../testcard-images/pal-mp4/pal-ice-skating.mp4"
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 1
  
  - name: "Lead-out"
    duration: 1
    source:
      type: "yuv422-image"
      file: "../testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-out"
      user_code: "1986"