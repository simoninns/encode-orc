name: "PAL-CLV Standard"
description: "PAL LaserDisc with CLV timecode (IEC 60857-1986)"

output:
  filename: "test-output/pal-clv.tbc"
  format: "pal-composite"

laserdisc:
  mode: "clv"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: true
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [15, 16, 17]
        format: "timecode"
      
      - type: "vits-pal"
        enabled: true
        signals:
          - line: 18
            signal: "multiburst"
          - line: 20
            signal: "uk-national"
          - line: 332
            signal: "itu-composite"
          - line: 333
            signal: "itu-composite"
      
      - type: "color-burst"
        enabled: true

sections:
  - name: "Test Content"
    duration: 20
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 1
      timecode_start: "00:00:00:00"
