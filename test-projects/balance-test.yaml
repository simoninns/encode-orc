name: "Balance Test"
description: "Test stereo balance control"

output:
  filename: "test-output/balance-test"
  format: "pal-composite"
  sound_format: "wav"

pipeline:
  metadata:
    generators:
      - type: "color-burst"

sections:
  # Left only (-100)
  - name: "Left_Only"
    duration: 25
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Red.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      balance: -100
  
  # Right only (+100)
  - name: "Right_Only"
    duration: 25
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Blue.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      balance: 100
  
  # Centered (0)
  - name: "Centered"
    duration: 25
    source:
      type: "png-image"
      file: "testcard-images/pal-wrwetzel-png/PAL-720x576-Color-One-Green.png"
    sound:
      type: "sine"
      start_freq_hz: 1000
      balance: 0
