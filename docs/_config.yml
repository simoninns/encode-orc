title: encode-orc Documentation
description: Generate test data for decode-orc video decoding pipeline
remote_theme: just-the-docs/just-the-docs
logo: "/assets/encode-orc_logotype.svg"

# GitHub Pages settings
url: "https://simoninns.github.io"
baseurl: "/encode-orc"

# just-the-docs theme settings
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Enable copy button on code blocks
enable_copy_code_button: true

# Footer
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/simoninns/encode-orc"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

footer_content: 'Copyright &copy; 2026 Simon Inns. Distributed under the <a href="https://github.com/simoninns/encode-orc/blob/main/LICENSE">GNU GENERAL PUBLIC LICENSE Version 3</a>.'

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Aux links (top right navigation)
aux_links:
  "View on GitHub":
    - "https://github.com/simoninns/encode-orc"

aux_links_new_tab: true
