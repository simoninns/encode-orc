name: Build and Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # Quick build check on Linux
  build-linux:
    name: Build on Linux (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    
    steps:
      - name: Install git and git-lfs
        run: |
          dnf install -y git git-lfs
      
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install dependencies (Fedora)
        run: |
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
          dnf install -y https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
          dnf install -y gcc gcc-c++ make cmake sqlite-devel yaml-cpp-devel libpng-devel spdlog-devel
          dnf install -y ffmpeg ffmpeg-devel --allowerasing
      
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release -j$(nproc)
      
      - name: Run Tests
        run: bash run-tests.sh
      
      - name: Verify executable
        run: ./build/encode-orc --version
      
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-fedora-release
          path: test-output/
          retention-days: 7
  
  # Build check on macOS
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install dependencies
        run: |
          brew update || true
          brew install \
            cmake \
            pkg-config \
            spdlog \
            sqlite \
            yaml-cpp \
            libpng \
            ffmpeg 2>&1 | grep -v "is already installed" || true
      
      - name: Configure
        run: |
          export HOMEBREW_PREFIX=$(brew --prefix)
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX"
      
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      
      - name: Run tests
        run: bash run-tests.sh
  
  # Build check on Windows
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/archives
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-
      
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: C:/ffmpeg
          key: ffmpeg-8.0.1-full-windows
      
      - name: Install FFmpeg (full build with dev files)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # Download FFmpeg full build (includes .lib import libraries)
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build.7z"
          $ffmpegZip = "$env:TEMP\ffmpeg.7z"
          $ffmpegDir = "C:\ffmpeg"
          
          Write-Host "Downloading FFmpeg from $ffmpegUrl..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          
          Write-Host "Extracting FFmpeg..."
          7z x $ffmpegZip -o"$ffmpegDir" -y
          
          # Find the extracted directory (it will be something like ffmpeg-8.0.1-full_build)
          $extractedDir = Get-ChildItem -Path $ffmpegDir -Directory | Select-Object -First 1
          $ffmpegRoot = $extractedDir.FullName
          
          Write-Host "FFmpeg extracted to: $ffmpegRoot"
          Write-Host "Contents of FFmpeg directory:"
          Get-ChildItem $ffmpegRoot | Select-Object Name, Mode
        shell: pwsh
      
      - name: Setup FFmpeg environment
        run: |
          # Find the FFmpeg directory (whether cached or just downloaded)
          $extractedDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -First 1
          $ffmpegRoot = $extractedDir.FullName
          
          Write-Host "Using FFmpeg from: $ffmpegRoot"
          
          # Add to PATH
          echo "$ffmpegRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Set FFmpeg root for CMake
          echo "FFMPEG_ROOT=$ffmpegRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      
      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="$env:FFMPEG_ROOT"
        shell: pwsh
      
      - name: Build
        run: cmake --build build --config Release --parallel
      
      - name: Run tests
        run: .\run-tests.ps1
        shell: pwsh

  # Code quality check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsqlite3-dev libspdlog-dev libyaml-cpp-dev libpng-dev clang-format
      
      - name: Check code formatting (if .clang-format exists)
        run: |
          if [ -f .clang-format ]; then
            find src include -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
          else
            echo "No .clang-format file found, skipping format check"
          fi
        continue-on-error: true

  # Flatpak build test
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: encode-orc.flatpak
          manifest-path: io.github.simoninns.encode-orc.yml
          cache-key: flatpak-builder-${{ github.sha }}
      
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: encode-orc-flatpak-dev
          path: encode-orc.flatpak
          retention-days: 7

  # Development package builds (on push to main/develop)
  dev-packages:
    name: Development Packages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build-linux, build-macos, build-windows, flatpak]
    uses: ./.github/workflows/package-builds.yml
    with:
      version: 'dev'
