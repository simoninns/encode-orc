name: Package Builds (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for package names (empty for dev builds)'
        required: false
        type: string
        default: 'dev'
    outputs:
      windows-artifact:
        description: "Name of Windows artifact"
        value: ${{ jobs.build-windows-package.outputs.artifact-name }}
      macos-artifact:
        description: "Name of macOS artifact"
        value: ${{ jobs.build-macos-package.outputs.artifact-name }}
      flatpak-artifact:
        description: "Name of Flatpak artifact"
        value: ${{ jobs.build-flatpak-package.outputs.artifact-name }}

jobs:
  build-windows-package:
    name: Build Windows Package
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          
          # Find WiX installation directory
          $wixPath = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wixPath) {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14"
          }
          $wixBin = Join-Path $wixPath "bin"
          
          Write-Host "WiX Toolset found at: $wixBin"
          
          # Add WiX to PATH for subsequent steps
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Verify candle.exe is accessible
          if (Test-Path (Join-Path $wixBin "candle.exe")) {
            Write-Host "✓ candle.exe found"
          } else {
            Write-Host "ERROR: candle.exe not found in $wixBin" -ForegroundColor Red
            exit 1
          }
      
      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/archives
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-
      
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: C:/ffmpeg
          key: ffmpeg-btbn-latest-win64-gpl-shared
      
      - name: Install FFmpeg (MSVC-compatible shared build)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # Download FFmpeg shared build with MSVC-compatible import libraries
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          $ffmpegDir = "C:\ffmpeg"
          
          Write-Host "Downloading FFmpeg from $ffmpegUrl..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegDir -Force
          
          # Find the extracted directory
          $extractedDir = Get-ChildItem -Path $ffmpegDir -Directory | Select-Object -First 1
          $ffmpegRoot = $extractedDir.FullName
          
          Write-Host "FFmpeg extracted to: $ffmpegRoot"
          Write-Host "Contents:"
          Get-ChildItem $ffmpegRoot | Select-Object Name, Mode
          
          Write-Host "`nLib directory:"
          Get-ChildItem "$ffmpegRoot\lib" | Select-Object Name
        shell: pwsh
      
      - name: Setup FFmpeg environment
        run: |
          # Find the FFmpeg directory (whether cached or just downloaded)
          $extractedDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -First 1
          $ffmpegRoot = $extractedDir.FullName
          
          Write-Host "Using FFmpeg from: $ffmpegRoot"
          
          # Add to PATH
          echo "$ffmpegRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Set FFmpeg root for CMake
          echo "FFMPEG_ROOT=$ffmpegRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      
      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="$env:FFMPEG_ROOT"
      
      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
      
      - name: Create RTF license for WiX
        run: |
          # Convert LICENSE to RTF format for WiX
          $licenseContent = Get-Content -Path "LICENSE" -Raw
          
          # Create simple RTF file with license text
          $rtfHeader = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Courier New;}}\f0\fs18"
          $rtfFooter = "}"
          
          # Escape special RTF characters and convert to RTF
          $licenseRtf = $licenseContent -replace '\\', '\\\\' -replace '{', '\{' -replace '}', '\}' -replace "`n", "\par`n"
          
          $fullRtf = $rtfHeader + "`n" + $licenseRtf + "`n" + $rtfFooter
          
          # Save to build directory
          $fullRtf | Out-File -FilePath "build/LICENSE.rtf" -Encoding ASCII
          
          Write-Host "Created LICENSE.rtf for WiX installer"
      
      - name: Generate MSI installer with CPack
        run: |
          cd build
          
          # Run CPack to generate the MSI with verbose output
          cpack -C Release -G WIX --verbose 2>&1 | Tee-Object -FilePath cpack-output.log
          $CPACK_RESULT = $LASTEXITCODE
          
          if ($CPACK_RESULT -ne 0) {
            Write-Host "`nCPack failed. Checking for WiX log..." -ForegroundColor Red
            $logPath = "_CPack_Packages/win64/WIX/wix.log"
            if (Test-Path $logPath) {
              Write-Host "`nWiX Log Contents:" -ForegroundColor Yellow
              Get-Content $logPath
            }
            exit 1
          }
          
          # Show install-related messages from CPack output
          Write-Host "`nSearching for install messages in CPack output:" -ForegroundColor Cyan
          Get-Content cpack-output.log | Select-String -Pattern "(Installing|yaml-cpp)" | ForEach-Object { Write-Host $_ }
          
          # Verify DLLs were deployed correctly
          $stagingDir = Get-ChildItem -Path "_CPack_Packages/win64/WIX" -Filter "Encode Orc-*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($stagingDir) {
            Write-Host "`nVerifying deployed DLLs in MSI package:" -ForegroundColor Cyan
            $binPath = Join-Path $stagingDir.FullName "bin"
            
            if (Test-Path $binPath) {
              # Check for vcpkg DLLs
              $vcpkgDlls = @("yaml-cpp.dll", "spdlog.dll", "libpng16.dll", "sqlite3.dll")
              Write-Host "`nvcpkg DLLs:" -ForegroundColor Yellow
              foreach ($dll in $vcpkgDlls) {
                if (Test-Path (Join-Path $binPath $dll)) {
                  Write-Host "  ✓ $dll" -ForegroundColor Green
                } else {
                  Write-Host "  ✗ $dll MISSING" -ForegroundColor Red
                }
              }
              
              # List all DLLs
              Write-Host "`nAll DLLs in package:" -ForegroundColor Yellow
              $allDlls = Get-ChildItem -Path $binPath -Filter "*.dll" -ErrorAction SilentlyContinue
              if ($allDlls) {
                $allDlls | Format-Table Name, Length -AutoSize
              } else {
                Write-Host "  (no DLLs found)" -ForegroundColor Red
              }
              
              # List all files
              Write-Host "`nAll files in bin:" -ForegroundColor Yellow
              Get-ChildItem -Path $binPath | Format-Table Name -AutoSize
            } else {
              Write-Host "`nERROR: bin directory does not exist at: $binPath" -ForegroundColor Red
              Write-Host "`nStaging directory contents:" -ForegroundColor Yellow
              Get-ChildItem -Path $stagingDir.FullName -Recurse | Format-Table FullName -AutoSize
            }
          } else {
            Write-Host "`nERROR: Could not find staging directory" -ForegroundColor Red
          }
          
          # List generated packages
          Write-Host "`nGenerated installer packages:"
          Get-ChildItem -Filter "*.msi"
      
      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          if [ "${{ inputs.version }}" = "dev" ]; then
            echo "name=encode-orc-windows" >> $GITHUB_OUTPUT
          else
            echo "name=windows-installer" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: build/*.msi
          retention-days: 7

  build-macos-package:
    name: Build macOS Package
    runs-on: macos-latest
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install system dependencies
        run: |
          brew update || true
          brew install --quiet \
            cmake \
            pkg-config \
            spdlog \
            sqlite \
            yaml-cpp \
            libpng \
            ffmpeg \
            create-dmg 2>&1 | grep -v "is already installed" || true
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Configure CMake
        run: |
          cd build
          export HOMEBREW_PREFIX=$(brew --prefix)
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      
      - name: Build
        run: |
          cd build
          cmake --build . -j$(sysctl -n hw.ncpu)
      
      - name: Create DMG
        run: |
          VERSION="${{ inputs.version }}"
          
          mkdir -p dmg-staging
          mkdir -p dmg-staging/bin
          cp build/encode-orc dmg-staging/bin/
          
          # Create README
          cat > "dmg-staging/README.txt" << 'EOF'
          Encode Orc - Installation Instructions
          ========================================
          
          This is a command-line tool. To install:
          
          1. Copy the "bin/encode-orc" binary to /usr/local/bin or another location in your PATH
          2. Make it executable: chmod +x /usr/local/bin/encode-orc
          3. Run it from the terminal: encode-orc --help
          
          EOF
          
          # Set DMG filename
          if [ "$VERSION" = "dev" ]; then
            DMG_NAME="encode-orc-macOS.dmg"
          else
            DMG_NAME="encode-orc-$VERSION-macOS.dmg"
          fi
          
          echo "Creating DMG: $DMG_NAME"
          create-dmg \
            --volname "Encode Orc" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            "$DMG_NAME" \
            "dmg-staging" \
            || hdiutil create -volname "Encode Orc" -srcfolder "dmg-staging" -ov -format UDZO "$DMG_NAME"
          
          echo "✓ DMG created successfully"
          ls -lh "$DMG_NAME"
      
      - name: Set artifact name
        id: set-artifact-name
        run: |
          if [ "${{ inputs.version }}" = "dev" ]; then
            echo "name=encode-orc-macos-dmg" >> $GITHUB_OUTPUT
          else
            echo "name=macos-dmg" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: encode-orc-*.dmg
          retention-days: 7

  build-flatpak-package:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Set bundle name
        id: set-bundle-name
        run: |
          VERSION="${{ inputs.version }}"
          if [ "$VERSION" = "dev" ]; then
            echo "bundle=encode-orc.flatpak" >> $GITHUB_OUTPUT
          else
            echo "bundle=encode-orc-$VERSION.flatpak" >> $GITHUB_OUTPUT
          fi
      
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.set-bundle-name.outputs.bundle }}
          manifest-path: io.github.simoninns.encode-orc.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      
      - name: Set artifact name
        id: set-artifact-name
        run: |
          if [ "${{ inputs.version }}" = "dev" ]; then
            echo "name=encode-orc-flatpak" >> $GITHUB_OUTPUT
          else
            echo "name=flatpak-bundle" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: encode-orc*.flatpak
          retention-days: 7
