name: "Picture Numbering Test"
description: "Test that picture numbers increment correctly across sections"

output:
  filename: "test-output/picture-numbering-test"
  format: "pal-composite"

laserdisc:
  mode: "cav"

pipeline:
  preprocessing:
    filters:
      chroma:
        enabled: false
  
  metadata:
    generators:
      - type: "biphase-vbi"
        enabled: true
        lines: [16, 17, 18, 328, 329, 330]
        format: "picture-number"
      
      - type: "color-burst"
        enabled: true

sections:
  # Lead-in should NOT have picture numbers
  - name: "Lead-in"
    duration: 2
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-in"
      user_code: "1234"
  
  # Chapter 1 starts at picture 1 (50 frames: 1-50)
  - name: "Chapter1_Part1"
    duration: 50
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      picture_start: 1
      chapter: 1
  
  # No picture_start specified - should continue from 51 (50 frames: 51-100)
  - name: "Chapter1_Part2"
    duration: 50
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 1
  
  # Chapter 2 - should continue from 101 (30 frames: 101-130)
  - name: "Chapter2"
    duration: 30
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "programme-area"
      chapter: 2
  
  # Lead-out should NOT have picture numbers
  - name: "Lead-out"
    duration: 2
    source:
      type: "yuv422-image"
      file: "testcard-images/pal-raw/625_50_75_BARS.raw"
    biphase-vbi:
      disc_area: "lead-out"
      user_code: "1234"
